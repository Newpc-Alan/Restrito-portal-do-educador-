<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventos · Painel · Portal do Educador</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--navy:#0F2C4A;--navy2:#1E324A;--green:#1A6B2A;--green2:#2DA68C;--cyan:#37B1DA;--lime:#B6D752;--paper:#FBFAF7;--ink:#16202e;--muted:#6b7785;--line:#e3e0d8;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
.topbar{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--lime)}
.topbar h1{font-size:17px}.logout{background:rgba(255,255,255,.12);border:none;color:#fff;padding:7px 12px;border-radius:8px;font-size:12px;cursor:pointer}
.wrap{max-width:760px;margin:22px auto;padding:0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 8px 24px rgba(15,44,74,.06);margin-bottom:18px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--navy);margin-bottom:16px;font-weight:700}
label{display:block;font-size:12px;font-weight:600;color:var(--navy);margin:12px 0 6px}
input,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:var(--paper)}
input:focus,textarea:focus{outline:none;border-color:var(--cyan);background:#fff}
textarea{resize:vertical;min-height:80px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{padding:13px 18px;border:none;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;margin-top:18px;width:100%}
.evento{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.evento .t{font-weight:700;color:var(--navy);font-size:15px}
.evento .links{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.linkrow{display:flex;align-items:center;gap:8px;font-size:12px}
.linkrow .lbl{font-weight:600;color:var(--green);min-width:115px}
.linkrow code{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:11.5px;flex:1;word-break:break-all}
.copy{border:none;background:var(--cyan);color:#fff;border-radius:7px;padding:5px 10px;font-size:11px;cursor:pointer}
.msg{margin-top:12px;font-size:13px}
#login{max-width:380px;margin:60px auto;padding:0 18px}
.muted{font-size:12px;color:var(--muted);margin-top:8px}
.evento .t{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}
.evento .t .seta{font-size:12px;color:var(--cyan);transition:transform .2s;flex-shrink:0}
.evento.aberto .t .seta{transform:rotate(90deg)}
.evento .corpo{display:none}
.evento.aberto .corpo{display:block}
.evento .acoes{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.btn-acao{border:none;border-radius:7px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer}
.btn-arq{background:#eef2f6;color:var(--navy)}
.btn-reativar{background:var(--green);color:#fff}
.btn-apagar{background:#fff;color:#b53636;border:1px solid #e3b3b3}
.btn-apagar:disabled{color:#b9c0c8;border-color:var(--line);cursor:not-allowed;background:#fafbfc}
.secao-arq{margin-top:22px}
.secao-arq>h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none}
.secao-arq>h3 .cont{background:var(--line);color:var(--navy);border-radius:20px;padding:1px 9px;font-size:11px;font-weight:700}
.arq-lista{display:none;margin-top:12px}
.secao-arq.aberta .arq-lista{display:block}
.evento.arquivado{opacity:.75;background:#fafbfc}
.tag-pres{font-size:10px;font-weight:700;color:var(--green);background:rgba(26,107,42,.1);padding:2px 8px;border-radius:20px;margin-left:8px}
</style>
</head>

  <div class="card">
    <h2 style="text-align:center">Painel de Eventos · Acesso restrito</h2>
    <label>E-mail</label><input id="loginEmail" type="email">
    <label>Senha</label><input id="loginSenha" type="password">
    <button class="btn" id="btnLogin">Entrar</button>
    <p class="muted" id="loginMsg" style="text-align:center"></p>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCHLrwHDUsVKKyIgHlbpkWsv1dOTBfY52M",
  authDomain: "portal-do-educador-interno.firebaseapp.com",
  projectId: "portal-do-educador-interno",
  storageBucket: "portal-do-educador-interno.firebasestorage.app",
  messagingSenderId: "133947200175",
  appId: "1:133947200175:web:a819a5a7c1196544d97a5a"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(),$=id=>document.getElementById(id);
let usuarioLogado=null;

// SHA-256 igual ao Hub (Web Crypto nativa)
async function sha256(txt){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

// Login validando contra a coleção 'usuarios' do Hub
async function fazerLogin(){
  const email=$('loginEmail').value.trim().toLowerCase();
  const senha=$('loginSenha').value;
  if(!email||!senha){$('loginMsg').textContent='Preencha e-mail e senha.';$('loginMsg').style.color='#b53636';return;}
  $('btnLogin').disabled=true;
  try{
    const doc=await db.collection('usuarios').doc(email).get();
    if(!doc.exists){ falhaLogin(); return; }
    const u=doc.data();
    if(u.ativo===false){ $('loginMsg').textContent='Usuário inativo.';$('loginMsg').style.color='#b53636';$('btnLogin').disabled=false;return; }
    const hash=await sha256(senha);
    if(hash!==u.senhaHash){ falhaLogin(); return; }
    usuarioLogado={email, nome:u.nome||email, role:u.role||''};
    $('login').style.display='none';$('app').style.display='block';
    listar();
  }catch(e){ $('loginMsg').textContent='Erro ao conectar. Tente novamente.';$('loginMsg').style.color='#b53636'; }
  $('btnLogin').disabled=false;
}
function falhaLogin(){$('loginMsg').textContent='E-mail ou senha incorretos.';$('loginMsg').style.color='#b53636';$('btnLogin').disabled=false;}

window.addEventListener('DOMContentLoaded',()=>{ $('login').style.display='block';$('app').style.display='none'; });
$('btnLogin').onclick=fazerLogin;
$('loginSenha').addEventListener('keydown',e=>{if(e.key==='Enter')fazerLogin();});
$('btnLogout').onclick=()=>{usuarioLogado=null;location.reload();};

$('btnCriar').onclick=async()=>{
  const nomeEvento=$('nomeEvento').value.trim(), curso=$('curso').value.trim();
  if(nomeEvento.length<3||curso.length<3){$('msg').textContent='Preencha nome do evento e curso.';$('msg').style.color='#b53636';return;}
  $('btnCriar').disabled=true;
  try{
    await db.collection('eventos').add({
      nomeEvento, curso, carga:$('carga').value, data:$('data').value, corpo:$('corpo').value,
      ass1nome:$('ass1nome').value, ass1cargo:$('ass1cargo').value,
      ass2nome:$('ass2nome').value, ass2cargo:$('ass2cargo').value,
      prefixoCert:$('prefixoCert').value, numInicio:parseInt($('numInicio').value||1,10),
      respaldo:$('respaldo').value, marca:'PORTAL DO EDUCADOR',
      instituicao:'Uma solução NEWPC Tecnologia LTDA · CNPJ 20.892.343/0001-15',
      inscricoesAbertas:true, criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    });
    $('msg').textContent='Evento criado!';$('msg').style.color='var(--green)';
    $('nomeEvento').value='';
  }catch(e){$('msg').textContent='Erro ao criar evento.';$('msg').style.color='#b53636';}
  $('btnCriar').disabled=false;
};

function base(arq){return location.href.replace(/admin-eventos\.html.*/,arq);}

// guarda quantos inscritos cada evento tem (pra travar o apagar)
const inscritosCount={};

function listar(){
  db.collection('eventos').orderBy('criadoEm','desc').onSnapshot(async snap=>{
    if(snap.empty){$('listaEventos').innerHTML='<p class="muted">Nenhum evento criado ainda.</p>';return;}

    // conta inscritos de cada evento (uma vez por render)
    await Promise.all(snap.docs.map(async d=>{
      try{const c=await db.collection('eventos').doc(d.id).collection('inscritos').get();inscritosCount[d.id]=c.size;}
      catch(e){inscritosCount[d.id]=0;}
    }));

    const ativos=[], arquivados=[];
    snap.docs.forEach(d=>{ (d.data().arquivado?arquivados:ativos).push(d); });

    let html='';
    if(ativos.length) html += ativos.map(d=>cardEvento(d,false)).join('');
    else html += '<p class="muted">Nenhum evento ativo. Veja os arquivados abaixo.</p>';

    if(arquivados.length){
      html += `<div class="secao-arq" id="secaoArq"><h3 data-toggle-arq>▸ Eventos arquivados <span class="cont">${arquivados.length}</span></h3>
        <div class="arq-lista">${arquivados.map(d=>cardEvento(d,true)).join('')}</div></div>`;
    }
    $('listaEventos').innerHTML=html;
    ligarHandlers();
  });
}

function cardEvento(d,arquivado){
  const ev=d.data(),id=d.id;
  const insc=`${base('inscricao.html')}?evento=${id}`;
  const cred=`${base('credenciamento.html')}?evento=${id}`;
  const emi=`${base('emissao.html')}?evento=${id}`;
  const cert=`${base('certificado.html')}?evento=${id}`;
  const qtd=inscritosCount[id]||0;
  const tagInsc = qtd>0 ? `<span class="tag-pres">${qtd} inscrito${qtd>1?'s':''}</span>` : '';
  const botaoArq = arquivado
    ? `<button class="btn-acao btn-reativar" data-reativar="${id}">Reativar</button>`
    : `<button class="btn-acao btn-arq" data-arquivar="${id}">Arquivar</button>`;
  // apagar só liberado se NÃO tem inscritos
  const apagarAttr = qtd>0
    ? `disabled title="Não é possível apagar: este evento tem ${qtd} inscrito(s). Arquive para preservar o histórico."`
    : `data-apagar="${id}" data-nome="${esc(ev.nomeEvento||ev.curso)}"`;
  return `<div class="evento ${arquivado?'arquivado':''}" id="ev-${id}">
    <div class="t" data-toggle="${id}"><span>${esc(ev.nomeEvento||ev.curso)}${tagInsc}</span><span class="seta">▸</span></div>
    <div class="corpo">
      <div class="links">
        ${linkrow('Inscrição (público)',insc)}
        ${linkrow('Credenciamento',cred)}
        ${linkrow('Emissão',emi)}
        ${linkrow('Download (público)',cert)}
      </div>
      <div class="acoes">
        ${botaoArq}
        <button class="btn-acao btn-apagar" ${apagarAttr}>Apagar</button>
      </div>
    </div></div>`;
}

function ligarHandlers(){
  // copiar
  document.querySelectorAll('.copy').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.dataset.l);b.textContent='✓';setTimeout(()=>b.textContent='Copiar',1200);});
  // abrir/fechar accordion do evento
  document.querySelectorAll('.t[data-toggle]').forEach(t=>t.onclick=()=>{t.closest('.evento').classList.toggle('aberto');});
  // abrir/fechar seção de arquivados
  const h=document.querySelector('[data-toggle-arq]');
  if(h) h.onclick=()=>{const s=h.closest('.secao-arq');s.classList.toggle('aberta');h.firstChild.textContent=s.classList.contains('aberta')?'▾ ':'▸ ';};
  // arquivar
  document.querySelectorAll('[data-arquivar]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;b.textContent='...';
    try{await db.collection('eventos').doc(b.dataset.arquivar).update({arquivado:true});}
    catch(e){alert('Erro ao arquivar.');b.disabled=false;b.textContent='Arquivar';}
  });
  // reativar
  document.querySelectorAll('[data-reativar]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;b.textContent='...';
    try{await db.collection('eventos').doc(b.dataset.reativar).update({arquivado:false});}
    catch(e){alert('Erro ao reativar.');b.disabled=false;b.textContent='Reativar';}
  });
  // apagar (com confirmação digitada)
  document.querySelectorAll('[data-apagar]').forEach(b=>b.onclick=async()=>{
    const nome=b.dataset.nome||'este evento';
    const r=prompt(`Apagar definitivamente "${nome}"?\n\nEsta ação NÃO pode ser desfeita.\nDigite APAGAR (em maiúsculas) para confirmar:`);
    if(r!=='APAGAR'){ if(r!==null) alert('Cancelado: texto não confere.'); return; }
    b.disabled=true;b.textContent='...';
    try{await db.collection('eventos').doc(b.dataset.apagar).delete();}
    catch(e){alert('Erro ao apagar.');b.disabled=false;b.textContent='Apagar';}
  });
}
function linkrow(lbl,url){return `<div class="linkrow"><span class="lbl">${lbl}</span><code>${url}</code><button class="copy" data-l="${url}">Copiar</button></div>`;}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
</script>
</body>
</html>
