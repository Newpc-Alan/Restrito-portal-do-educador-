<title>Inscrição · Portal do Educador</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
:root{--navy:#0F2C4A;--navy2:#1E324A;--green:#1A6B2A;--green2:#2DA68C;--cyan:#37B1DA;--lime:#B6D752;--paper:#FBFAF7;--ink:#16202e;--muted:#6b7785;--line:#e3e0d8;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:radial-gradient(1000px 500px at 100% -10%,rgba(55,177,218,.13),transparent 60%),radial-gradient(900px 450px at -10% 110%,rgba(45,166,140,.13),transparent 55%),var(--paper);color:var(--ink);min-height:100vh;padding:24px}
.box{max-width:480px;margin:30px auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 44px rgba(15,44,74,.1);overflow:hidden}
.head{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:28px;text-align:center;border-bottom:3px solid var(--lime)}
.head h1{font-size:20px;font-weight:700}
.head p{font-size:13px;opacity:.8;margin-top:4px}
.evento-nome{font-size:15px;font-weight:600;color:var(--lime);margin-top:10px}
.body{padding:28px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--navy);margin:16px 0 6px}
label:first-child{margin-top:0}
input,select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:var(--paper);transition:.15s}
input:focus,select:focus{outline:none;border-color:var(--cyan);background:#fff;box-shadow:0 0 0 3px rgba(55,177,218,.12)}
select:disabled{opacity:.6;cursor:not-allowed}
.btn{width:100%;padding:14px;border:none;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;margin-top:22px;box-shadow:0 8px 20px rgba(26,107,42,.28);transition:.18s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.msg{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:13.5px;display:none;line-height:1.5}
.msg.show{display:block}
.msg.err{background:rgba(214,69,69,.1);color:#b53636;border:1px solid rgba(214,69,69,.25)}
.ok-screen{display:none;text-align:center;padding:10px 0}
.ok-screen.show{display:block}
.check{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.ok-screen h2{color:var(--green);font-size:20px;margin-bottom:6px}
.ok-screen p{color:var(--muted);font-size:13.5px;line-height:1.5}
#qr{display:flex;justify-content:center;margin:22px auto;padding:16px;background:#fff;border:2px solid var(--line);border-radius:14px;width:fit-content}
.qr-hint{font-size:12px;color:var(--muted);margin-top:4px}
.cod{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--navy);font-size:16px;letter-spacing:1px;margin-top:8px}
.foot{text-align:center;font-size:11px;color:var(--muted);padding:0 28px 22px}
</style>
</head>

(function initLocalidades(){
  const selUF = $('estado'), selMun = $('municipio');
  // popula estados (sigla + nome)
  LOCALIDADES.estados.forEach(([uf,nome])=>{
    const o=document.createElement('option'); o.value=uf; o.textContent=uf+' · '+nome; selUF.appendChild(o);
  });
  // ao trocar o estado, popula municípios
  selUF.addEventListener('change', ()=>{
    selMun.innerHTML='';
    const uf=selUF.value;
    if(!uf){ selMun.disabled=true; selMun.innerHTML='<option value="">Selecione o estado primeiro</option>'; return; }
    const muns=LOCALIDADES.municipios[uf]||[];
    selMun.disabled=false;
    const o0=document.createElement('option'); o0.value=''; o0.textContent='Selecione o município'; selMun.appendChild(o0);
    muns.forEach(m=>{ const o=document.createElement('option'); o.value=m; o.textContent=m; selMun.appendChild(o); });
  });
})();
const params = new URLSearchParams(location.search);
const eventoId = params.get('evento');

let evento = null;

async function carregarEvento(){
  if(!eventoId){ $('evNome').textContent = 'Evento não informado no link'; $('btn').disabled = true; return; }
  try{
    const snap = await db.collection('eventos').doc(eventoId).get();
    if(!snap.exists){ $('evNome').textContent = 'Evento não encontrado'; $('btn').disabled = true; return; }
    evento = snap.data();
    if(evento.inscricoesAbertas === false){ $('evNome').textContent = 'Inscrições encerradas'; $('btn').disabled = true; return; }
    $('evNome').textContent = evento.nomeEvento || evento.curso || 'Evento';
    if(evento.temOficinas){ await carregarOficinas(); }
  }catch(e){
    $('evNome').textContent = 'Erro ao carregar evento';
    erro('Não foi possível conectar. Tente novamente em instantes.');
  }
}

let oficinasEvento=[];
async function carregarOficinas(){
  try{
    const snap=await db.collection('eventos').doc(eventoId).collection('oficinas').orderBy('horario').get();
    oficinasEvento=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!oficinasEvento.length) return;
    const html=oficinasEvento.map(o=>{
      const cheia=o.vagaLimitada && (o.inscritos||0)>=o.vagas;
      const vagaTxt=o.vagaLimitada ? `${Math.max(0,o.vagas-(o.inscritos||0))} vaga(s)` : 'Aberta';
      const det=[o.horario, o.local, o.palestrante].filter(Boolean).map(escHtml).join(' · ');
      return `<label class="ofi-item ${cheia?'cheia':''}" style="display:flex;gap:10px;align-items:flex-start;padding:11px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:${cheia?'not-allowed':'pointer'};opacity:${cheia?'.55':'1'}">
        <input type="checkbox" class="ofi-chk" value="${o.id}" data-horario="${escHtml(o.horario||'')}" ${cheia?'disabled':''} style="width:auto;margin-top:3px">
        <span style="flex:1">
          <span style="font-weight:700;color:var(--navy);display:block">${escHtml(o.nome)} ${cheia?'<span style="color:#b53636;font-size:11px">· LOTADA</span>':''}</span>
          ${det?`<span style="font-size:12px;color:var(--muted)">${det}</span>`:''}
          <span style="font-size:11px;color:var(--cyan);font-weight:600;display:block;margin-top:2px">${vagaTxt}</span>
        </span>
      </label>`;
    }).join('');
    $('oficinasArea').innerHTML=`<label>Escolha as oficinas (respeite os horários)</label>${html}<p class="msg" id="ofiAviso" style="font-size:12px;margin:0"></p>`;
    $('oficinasArea').style.display='block';
    // valida choque de horário ao marcar
    document.querySelectorAll('.ofi-chk').forEach(chk=>chk.onchange=()=>validarHorarios(chk));
  }catch(e){ /* se falhar, segue sem oficinas */ }
}

function validarHorarios(chkAlterado){
  if(!chkAlterado.checked) { $('ofiAviso').textContent=''; return; }
  const h=chkAlterado.dataset.horario;
  if(!h) return;
  const marcados=[...document.querySelectorAll('.ofi-chk:checked')];
  const conflito=marcados.find(c=>c!==chkAlterado && c.dataset.horario && c.dataset.horario===h);
  if(conflito){
    chkAlterado.checked=false;
    $('ofiAviso').textContent='Você já escolheu outra oficina nesse mesmo horário ('+h+').';
    $('ofiAviso').style.color='#b53636';
  }else{
    $('ofiAviso').textContent='';
  }
}
function escHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function erro(t){ const m=$('msg'); m.className='msg show err'; m.textContent=t; }

// máscara de CPF enquanto digita
$('cpf').oninput = e => {
  let v = e.target.value.replace(/\D/g,'').slice(0,11);
  v = v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
  e.target.value = v;
};

// validação real de CPF (dígitos verificadores)
function cpfValido(cpf){
  cpf = cpf.replace(/\D/g,'');
  if(cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
  let s=0; for(let i=0;i<9;i++) s += parseInt(cpf[i])*(10-i);
  let d1 = (s*10)%11; if(d1===10) d1=0; if(d1!==parseInt(cpf[9])) return false;
  s=0; for(let i=0;i<10;i++) s += parseInt(cpf[i])*(11-i);
  let d2 = (s*10)%11; if(d2===10) d2=0; return d2===parseInt(cpf[10]);
}

function gerarCodigo(){
  // código curto e legível: PDE + 6 base36
  return 'INS-' + Date.now().toString(36).toUpperCase().slice(-4) + Math.random().toString(36).toUpperCase().slice(2,5);
}

$('btn').onclick = async () => {
  const nome = $('nome').value.trim();
  const email = $('email').value.trim();
  const cpfRaw = $('cpf').value.replace(/\D/g,'');
  if(nome.length < 3){ erro('Informe seu nome completo.'); return; }
  if(!cpfValido(cpfRaw)){ erro('CPF inválido. Confira os números.'); return; }
  if(!/^[^@]+@[^@]+\.[^@]+$/.test(email)){ erro('Informe um e-mail válido.'); return; }
  if(!$('estado').value){ erro('Selecione o estado.'); return; }
  if(!$('municipio').value){ erro('Selecione o município.'); return; }
  $('btn').disabled = true; $('btn').textContent = 'Enviando...';
  $('msg').className = 'msg';

  const codigo = gerarCodigo();
  try{
    const col = db.collection('eventos').doc(eventoId).collection('inscritos');
    // impede inscrição duplicada do mesmo CPF neste evento
    const dup = await col.where('cpf','==',cpfRaw).limit(1).get();
    if(!dup.empty){
      const ja = dup.docs[0].data();
      $('form-area').style.display = 'none';
      $('ok').classList.add('show');
      $('ok').querySelector('h2').textContent = 'Você já estava inscrito!';
      $('meuCod').textContent = ja.codigoInscricao || codigo;
      new QRCode($('qr'), { text: ja.codigoInscricao || codigo, width:180, height:180, colorDark:'#0F2C4A', colorLight:'#ffffff' });
      return;
    }
    // oficinas escolhidas
    const oficinasEscolhidas=[...document.querySelectorAll('.ofi-chk:checked')].map(c=>c.value);

    const novoInscritoRef = col.doc();
    const dadosInscrito = {
      nome, email,
      cpf: cpfRaw,
      escola: $('escola').value.trim(),
      estado: $('estado').value,
      municipio: $('municipio').value,
      codigoInscricao: codigo,
      presente: false,
      checkinEm: null,
      codigoCert: null,
      oficinas: oficinasEscolhidas,
      inscritoEm: firebase.firestore.FieldValue.serverTimestamp()
    };

    if(oficinasEscolhidas.length){
      // TRANSAÇÃO: reserva vaga atomicamente (não fura vaga mesmo com muitos simultâneos)
      await db.runTransaction(async tx=>{
        const refs = oficinasEscolhidas.map(oid=>db.collection('eventos').doc(eventoId).collection('oficinas').doc(oid));
        const snaps = await Promise.all(refs.map(r=>tx.get(r)));
        // valida vagas
        snaps.forEach((s,idx)=>{
          if(!s.exists) throw new Error('Oficina indisponível. Recarregue a página.');
          const o=s.data();
          if(o.vagaLimitada && (o.inscritos||0) >= o.vagas){
            throw new Error('A oficina "'+(o.nome||'')+'" lotou. Escolha outra e tente de novo.');
          }
        });
        // incrementa contadores e grava inscrito
        refs.forEach(r=>tx.update(r,{inscritos:firebase.firestore.FieldValue.increment(1)}));
        tx.set(novoInscritoRef, dadosInscrito);
      });
    }else{
      await novoInscritoRef.set(dadosInscrito);
    }
    $('form-area').style.display = 'none';
    $('ok').classList.add('show');
    $('meuCod').textContent = codigo;
    new QRCode($('qr'), { text: codigo, width: 180, height: 180, colorDark: '#0F2C4A', colorLight: '#ffffff' });
  }catch(e){
    $('btn').disabled = false; $('btn').textContent = 'Confirmar inscrição';
    const msgLotou = e && e.message && /lot|indispon/i.test(e.message);
    erro(msgLotou ? e.message : 'Não foi possível concluir a inscrição. Verifique sua conexão e tente novamente.');
  }
};

carregarEvento();
</script>
